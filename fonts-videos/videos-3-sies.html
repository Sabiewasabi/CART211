<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snowy Video</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 20px;
        }

        .size-controls {
            margin-bottom: 20px;
        }

        .size-controls button {
            padding: 8px 14px;
            margin: 3px;
            cursor: pointer;
        }

        video {
            display: block;
            width: 100%;
            max-width: 100%;
            height: auto;
            background-color: black;
            transition: width 0.3s ease;
        }

        video.small {
            width: 320px;
        }

        video.medium {
            width: 480px;
        }

        video.large {
            width: 720px;
        }

        video.full {
            width: 100%;
        }
    </style>
</head>

<body>

    <h1>Snowy Video ❄️</h1>
    <p>Watch this amazing snowy video below!</p>

    <div class="size-controls">
        <button onclick="changeSize('small')">Small</button>
        <button onclick="changeSize('medium')">Medium</button>
        <button onclick="changeSize('large')">Large</button>
        <button onclick="changeSize('full')">Fullscreen</button>

        <video id="myvideo" class="full" controls>
            <source src="snow.mp4" type="video/mp4">
            Sorry, your browser cannot load this video.
        </video>
    </div>

    <script>
        function changeSize(size) {
            const video = document.getElementById("myvideo");
            // Remove all size classes
            video.classList.remove("small", "medium", "large", "full");
            // Add the selected size class
            video.classList.add(size);
        }
    </script>

</body>

</html>
