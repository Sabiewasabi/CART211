<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Background Video</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100;
            color: white;
            background-color: black;
        }

        .backgroundvideo {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center;
            /* z-index; : manages layer hiearchy */
            z-index: -1;
        }

        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            /* RBGA, a is alpha = controls opacity/darkness/lightness */
            background-color: rgba(0, 0, 0, 0.4);
            z-index: 0;
        }

        .content {
            position: relative;
            z-index: 1;
            min-height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-content: center;
            text-align: center;
            padding: 20px;
        }

        h1 {
            /* Clamp is a function that takes 3 values clamp(min,pref,max) */
            /* Rem is a unit based on the root fontsize of the webpage viewport */
            font-size: clamp(2rem, 5w, 4rem);
            margin-bottom: 15px;
        }

        p {
            font-size: 1.2rem;
        }
    </style>
</head>

<body>
    <video class="backgroundvideo" autoplay muted loop playinline aria-hidden="true" tabindex="-1">

        <source src="snow.mp4" type="video/mp4">
    </video>

    <div class="overlay">
        <main class="content">
            <h1>Snowy Video ❄️ </h1>
            <p>Beautiful snowy video</p>
    </div>

    </main>
</body>


</body>



</html>
